<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shario Boss - Ultra Edition</title>
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #a83c00;
            --bg: #0a0a1a;
            --accent: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none; color: white;
            user-select: none;
        }

        #gameWrapper {
            position: relative;
            width: 100%; max-width: 900px;
            aspect-ratio: 16/9; background: #000;
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px rgba(255, 107, 0, 0.4);
            border-radius: 12px; overflow: hidden;
        }

        canvas {
            display: block; width: 100%; height: 100%;
            image-rendering: pixelated;
        }

        /* UI HUD */
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 15px 25px; display: flex; justify-content: space-between;
            pointer-events: none; font-size: clamp(12px, 2.5vw, 20px);
            font-weight: 900; text-shadow: 2px 2px 0 #000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
        }

        #powerMsg {
            position: absolute; top: 80px; width: 100%;
            text-align: center; color: #fff; font-size: clamp(20px, 4vw, 32px);
            font-weight: 900; text-shadow: 0 0 20px #ff0, 3px 3px 0 #000;
            opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
            z-index: 30; transform: scale(0.8);
        }

        .screen {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 50; text-align: center;
            backdrop-filter: blur(8px); transition: opacity 0.4s;
        }

        h1 {
            font-size: clamp(32px, 8vw, 72px);
            color: var(--primary); text-shadow: 4px 4px 0 var(--primary-dark);
            margin-bottom: 20px; letter-spacing: 6px;
        }

        .big-btn {
            padding: 18px 45px; background: var(--primary);
            border: none; border-radius: 8px; color: white;
            font-family: inherit; font-weight: bold; font-size: 24px;
            cursor: pointer; box-shadow: 0 8px 0 var(--primary-dark);
            transition: all 0.1s;
        }

        .big-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--primary-dark); }

        /* MOBILE CONTROLS */
        #controls {
            display: flex; justify-content: space-between;
            width: 100%; max-width: 900px; padding: 15px; gap: 20px;
        }

        .ctrl-group { display: flex; gap: 15px; }
        .ctrl-btn {
            width: 70px; height: 70px; background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; color: white; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            user-select: none; transition: background 0.1s;
        }
        .ctrl-btn.active { background: var(--primary); border-color: white; transform: scale(0.9); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="hud">
        <div id="hudScore">SCORE: 0</div>
        <div id="hudPower" style="color:#0ff;">POWER: NONE</div>
        <div id="hudLevel">LVL: 1</div>
        <div id="hudLives">❤️❤️❤️</div>
    </div>
    <div id="powerMsg">UP POWER!</div>

    <!-- SCREENS -->
    <div class="screen" id="titleScreen">
        <h1>🍄 SHARIO BOSS</h1>
        <p>20 Massive Levels | 25 UP POWERS | Health Bars</p>
        <div style="margin-top: 30px;">
            <button class="big-btn" onclick="game.start(1)">▶ START ADVENTURE</button>
        </div>
    </div>

    <div class="screen hidden" id="levelScreen">
        <h1 id="lvlName">LEVEL 2</h1>
        <p id="lvlTheme" style="color:#0ff; font-weight:bold; font-size: 24px;"></p>
        <p>GET READY...</p>
    </div>

    <div class="screen hidden" id="gameOverScreen">
        <h1>GAME OVER</h1>
        <div class="btn-container">
            <button class="big-btn" id="continueBtn" onclick="game.continueLevel()">↩ CONTINUE LEVEL</button>
            <p style="margin-top:20px; cursor:pointer; color:#888;" onclick="game.start(1)">or start from Beginning</p>
        </div>
    </div>

    <div class="screen hidden" id="winScreen">
        <h1>👑 LEGENDARY HERO!</h1>
        <p>You saved the Princess and conquered all 20 levels!</p>
        <div class="btn-container">
            <button class="big-btn" onclick="game.start(1)">▶ PLAY AGAIN</button>
        </div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-group">
        <div class="ctrl-btn" id="btnLeft">◀</div>
        <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
    <div class="ctrl-group">
        <div class="ctrl-btn" id="btnFire">🔥</div>
        <div class="ctrl-btn" id="btnJump">▲</div>
    </div>
</div>

<script>
const audio = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(freq, type, dur, vol = 0.2, ramp = 0.001) {
        if (!this.ctx) return;
        try {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = type; o.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(vol, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(ramp, this.ctx.currentTime + dur);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + dur);
        } catch(e) {}
    },
    jump() { this.play(450, 'square', 0.15); },
    swim() { this.play(300, 'sine', 0.2, 0.1); },
    bump() { this.play(200, 'sine', 0.1, 0.4); },
    coin() { this.play(900, 'sine', 0.1, 0.3); this.play(1200, 'sine', 0.2, 0.2); },
    powerup() { [400, 600, 800, 1000].forEach((f, i) => setTimeout(() => this.play(f, 'square', 0.15), i * 60)); },
    fire() { this.play(300, 'sawtooth', 0.1, 0.3); },
    hit() { this.play(100, 'sawtooth', 0.2, 0.4); },
    boss() { this.play(60, 'sawtooth', 0.4, 0.5); },
    win() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.play(f, 'square', 0.2), i * 150)); }
};

const THEMES = [
    { name: "Grasslands", bg1: "#1a1a4e", bg2: "#000", gTop: "#5a3", gMid: "#432", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Desert Ruins", bg1: "#aa4400", bg2: "#330000", gTop: "#ed8", gMid: "#c94", grav: 0.5, fric: 0.85, jump: -15, isWater: false },
    { name: "Underwater Reef", bg1: "#0044aa", bg2: "#001133", gTop: "#38c", gMid: "#148", grav: 0.15, fric: 0.9, jump: -8, isWater: true },
    { name: "Dark Caverns", bg1: "#222", bg2: "#000", gTop: "#666", gMid: "#333", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Lava Fortress", bg1: "#400", bg2: "#100", gTop: "#333", gMid: "#111", grav: 0.5, fric: 0.75, jump: -15, isWater: false, hasLava: true },
    { name: "Frozen Peaks", bg1: "#88ccff", bg2: "#002244", gTop: "#fff", gMid: "#aef", grav: 0.5, fric: 0.98, jump: -15, isWater: false },
    { name: "Cloud Kingdom", bg1: "#66aaff", bg2: "#fff", gTop: "#eee", gMid: "#ccc", grav: 0.4, fric: 0.75, jump: -16, isWater: false },
    { name: "Haunted Forest", bg1: "#304", bg2: "#000", gTop: "#342", gMid: "#121", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Abyssal Trench", bg1: "#001133", bg2: "#000", gTop: "#135", gMid: "#012", grav: 0.15, fric: 0.9, jump: -8, isWater: true },
    { name: "Bowser's Core", bg1: "#500", bg2: "#200", gTop: "#222", gMid: "#000", grav: 0.5, fric: 0.75, jump: -15, isWater: false, hasLava: true },
    { name: "Jungle Canopy", bg1: "#141", bg2: "#000", gTop: "#262", gMid: "#432", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Moon Base", bg1: "#001", bg2: "#222", gTop: "#888", gMid: "#444", grav: 0.25, fric: 0.85, jump: -10, isWater: false },
    { name: "Crystal Caves", bg1: "#404", bg2: "#101", gTop: "#c0f", gMid: "#606", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Sky Castle", bg1: "#8af", bg2: "#68d", gTop: "#fff", gMid: "#ddd", grav: 0.5, fric: 0.75, jump: -15, isWater: false },
    { name: "Deep Sea Ruins", bg1: "#002", bg2: "#000", gTop: "#048", gMid: "#024", grav: 0.15, fric: 0.9, jump: -8, isWater: true },
    { name: "Neon City", bg1: "#000", bg2: "#102", gTop: "#0ff", gMid: "#066", grav: 0.5, fric: 0.9, jump: -15, isWater: false },
    { name: "Magma Chamber", bg1: "#600", bg2: "#200", gTop: "#a20", gMid: "#500", grav: 0.5, fric: 0.75, jump: -15, isWater: false, hasLava: true },
    { name: "Void Horizon", bg1: "#101", bg2: "#000", gTop: "#505", gMid: "#202", grav: 0.5, fric: 0.75, jump: -16, isWater: false },
    { name: "Storm Clouds", bg1: "#445", bg2: "#112", gTop: "#778", gMid: "#334", grav: 0.45, fric: 0.75, jump: -15, isWater: false },
    { name: "Omega Fortress", bg1: "#000", bg2: "#300", gTop: "#222", gMid: "#000", grav: 0.5, fric: 0.75, jump: -15, isWater: false, hasLava: true }
];

const POWERS = [
    { id: 'speed', name: 'SPEED', color: '#0ff' }, { id: 'jump', name: 'SUPER JUMP', color: '#0f0' },
    { id: 'fire', name: 'FIREBALL', color: '#f80' }, { id: 'life', name: 'EXTRA LIFE', color: '#f00' },
    { id: 'shield', name: 'SHIELD', color: '#00f' }, { id: 'star', name: 'STAR MODE', color: '#ff0' },
    { id: 'double', name: 'DOUBLE JUMP', color: '#f0f' }, { id: 'bomb', name: 'NUKE', color: '#444' },
    { id: 'mega', name: 'MEGA SHARIO', color: '#f44' }, { id: 'mini', name: 'MINI SHARIO', color: '#4f4' },
    { id: 'moon', name: 'MOON JUMP', color: '#ddd' }, { id: 'score', name: 'JACKPOT', color: '#ff4' },
    { id: 'ghost', name: 'GHOST', color: '#fff' }, { id: 'jetpack', name: 'JETPACK', color: '#f04' },
    { id: 'slowmo', name: 'TIME SLOW', color: '#0af' }, { id: 'multi', name: 'MULTI FIRE', color: '#fa0' },
    { id: 'magnetic', name: 'MAGNET', color: '#44f' }, { id: 'regen', name: 'REGEN', color: '#f88' },
    { id: 'dash', name: 'DASH', color: '#0ff' }, { id: 'gold', name: 'GOLD TOUCH', color: '#fd0' },
    { id: 'float', name: 'HOVER', color: '#0ff' }, { id: 'shield2', name: 'SHIELD+', color: '#008' },
    { id: 'rapid', name: 'RAPID FIRE', color: '#f60' }, { id: 'laser', name: 'GIGA LASER', color: '#f0f' },
    { id: 'titan', name: 'TITAN', color: '#999' }
];

const Sprites = {
    colors: { 'R': '#D32', 'S': '#FCA', 'B': '#24D', 'W': '#FFF', 'K': '#420', 'N': '#320', 'O': '#F80', 'C': '#0CD', 'P': '#C0F', 'M': '#A08', 'Y': '#FF0', 'X': '#603', 'A': '#806', 'G': '#260', 'Q': '#F07', 'T': '#C86', 'D': '#FFB6C1', 'H': '#FFD700', 'L': '#f40', 'J': '#fcf', 'U': '#0af' },
    player: {
        stand: ['....RRRRRR......', '...RRRRRRRRRR...', '...KKSSSSSSKK...', '..KSSSSSSSSSK...', '..KSSSSSSSSSK...', '..KSSSWWSSSK...', '...RRSSSSSRR....', '...RRRRRRRRR....', '...RRRRRRRRRR...', '..BBBRRRRBBB....', '.BBBBBBBBBBBBB..', '.BB.BBBBBBB.BB..', '.BB.BBBBBBB.BB..', '..BBBBBBBBBBB...', '..NNN.....NNN...', '..NNN.....NNN...'],
        jump: ['....RRRRRR......', '...RRRRRRRRRR...', '...KKSSSSSSKK...', '..KSSSSSSSSSK...', '..KSSSSSSSSSK...', '..KSSSWWSSSK...', '...RRSSSSSRR....', '..RRRRRRRRRR....', '..RRRRRRRRRR....', '.WBBBRRRRBBBW...', '.WBBBBBBBBBBBW..', '..WBBBBBBBBBW...', '...BBBBBBBBB....', '..NNN.....NNN...', '.NNN.......NNN..', '...............']
    },
    goomba: ['....BBBBBB......', '...BBBBBBBBBB...', '..BBBBBBBBBBBB..', '..BKBBBBBBBBKB..', '..BKWWBBBBWWKB..', '..BBWKBBBBWKBB..', '..BBBWBBBBWBBB..', '..BBBBBBBBBBBB..', '..BBBBTTTBBBBB..', '....TTTTTTTT....', '..NNNN....NNNN..', '..NNNN....NNNN..'],
    shark: ['.........WWWWW..', '-------WWWWWWWW.', '--WW--WWWWWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW', '-WWWWWWKWWWWWW--', '---WWWWWWWWWW---', '-----WWWWWWW----'],
    jelly: ['--JJJJJJJJJ--', '-JJJJJJJJJJJ-', 'JJJJJJJJJJJJJ', 'JJJ-JJJ-JJJJJ', 'JJJJJJJJJJJJJ', '-JJ-JJ-JJ-JJ-', '--J--J--J--J-', '--J--J--J--J-'],
    boss: ['....PP....PP....', '....PP....PP....', '...PPP....PPP...', '..MMMMMMMMMMMM..', '.MMMMMMMMMMMMMMM', '.MYYMMMMMMMYYMM.', '.MRRMMMMMMMRRMM.', '.MMMMMMMMMMMMMMM', '.MMXXXXXXXMMMMMM', '.MMMMMMMMMMMMMMM', 'AMMMMMMMMMMMMMMMA', 'AMMMMMMMMMMMMMMMA', 'AAAMMMMMMMMMMAAAA', '...MMMMMMMMMMM..', '...MMMMMMMMMM...', '..MMMMMMMMMMM...', '..MMMMMMMMMMM...', '..GGMMMMMMGG....', '..GGMMMMMMGG....', '..GGMMMMMMGG....', '...GGGGGGGG.....', '....GGGGGG......', '..GGG....GGG....', '..GGG....GGG....'],
    princess: ['.....HHHHH......', '....H-HHH-H.....', '....HDDDDDH.....', '...DDSWDWSDD....', '....DDDDDDD.....', '.....DDDDD......', '....DDDDDDD.....', '...DDDDDDDDD....', '..DDDDDDDDDDD...', '.DDDDDDDDDDDDD..', '.DDDDDDDDDDDDD..', '.DDDDDDDDDDDDD..', '..DDDDDDDDDDD...', '...DDDDDDDDD....', '....WWWWWWW.....', '....WWWWWWW.....']
};

const game = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null, state: 'TITLE', score: 0, lives: 3, level: 1, maxLevels: 20, theme: THEMES[0], camera: 0, width: 800, height: 450, levelWidth: 6000,
    player: null, tiles: [], enemies: [], particles: [], items: [], fireballs: [], boss: null, princess: null,
    mouseFireTriggered: false, keys: {}, keyEdges: {}, upPowerAlpha: 0,
    cutsceneTimer: 0, cutsceneBoss: null, cutscenePrincess: null,
    flagY: 160, flagTriggered: false, flagTimer: 0, currentPowerName: "",
    
    init() {
        this.ctx = this.canvas.getContext('2d');
        this.bindEvents(); 
        this.loop();
    },

    bindEvents() {
        window.addEventListener('keydown', e => { if (!this.keys[e.code]) this.keyEdges[e.code] = true; this.keys[e.code] = true; });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; this.keyEdges[e.code] = false; });
        
        const bindBtn = (id, code) => {
            const btn = document.getElementById(id);
            const start = (e) => { 
                e.preventDefault(); 
                if(!this.keys[code]) this.keyEdges[code] = true; 
                this.keys[code] = true; btn.classList.add('active'); 
                audio.init(); 
            };
            const end = (e) => { 
                e.preventDefault(); 
                this.keys[code] = false; this.keyEdges[code] = false; 
                btn.classList.remove('active'); 
            };
            btn.addEventListener('touchstart', start); btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', end);
        };
        bindBtn('btnLeft', 'ArrowLeft'); bindBtn('btnRight', 'ArrowRight'); 
        bindBtn('btnJump', 'Space'); bindBtn('btnFire', 'KeyF');

        this.canvas.addEventListener('mousedown', (e) => { 
            if (e.button === 0 && this.state === 'PLAYING') { this.mouseFireTriggered = true; audio.init(); } 
        });
    },

    isPressed(code) { if (this.keyEdges[code]) { this.keyEdges[code] = false; return true; } return false; },

    spawnParticles(x, y, color, count = 5) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x, y, color,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 50
            });
        }
    },

    start(lvl = 1) {
        audio.init(); 
        if (lvl === 1) {
            this.state = 'CUTSCENE'; this.cutsceneTimer = 0;
            this.cutsceneBoss = { x: 900, y: 100 }; this.cutscenePrincess = { x: 300, y: 338 };
        } else { this.state = 'PLAYING'; }
        this.score = lvl === 1 ? 0 : this.score; this.lives = 3; this.level = lvl; 
        this.loadLevel(this.level); this.hideScreens();
    },

    continueLevel() { this.start(this.level); },

    loadLevel(n) {
        this.level = n; this.theme = THEMES[n - 1] || THEMES[0];
        this.levelWidth = 5000 + (n * 800); this.camera = 0;
        this.tiles = []; this.enemies = []; this.items = []; this.particles = []; this.fireballs = [];
        this.boss = null; this.princess = null; this.flagTriggered = false; this.flagY = 160; this.flagTimer = 0;

        const isBossLevel = (n % 5 === 0);
        let groundXs = new Set();
        let gapCount = 0;

        for (let x = 0; x < this.levelWidth; x += 32) {
            if (!isBossLevel && x > 800 && x < this.levelWidth - 1200 && gapCount === 0 && Math.random() < (0.05 + n*0.005)) { 
                gapCount = Math.floor(Math.random() * 3) + 2; 
            }
            if (gapCount > 0) { gapCount--; continue; }
            this.tiles.push({ x, y: 450-32, type: 'ground' }); this.tiles.push({ x, y: 450-64, type: 'ground' });
            groundXs.add(x);
        }
        
        if (!isBossLevel) {
            for (let x = 448; x < this.levelWidth - 800; x += 224) {
                let isSafe = true;
                for (let sx = x - 64; sx <= x + 160; sx += 32) {
                    if (!groundXs.has(Math.floor(sx/32)*32)) { isSafe = false; break; }
                }
                if (!isSafe) continue;

                let py = 260 - Math.random() * 80;
                if (Math.random() > 0.3) {
                    for(let j=0; j<3; j++) {
                        let isM = j===1 || Math.random() > 0.85;
                        this.tiles.push({ x: x + j*32, y: py, type: isM ? 'mystery' : 'block', hit: false, bounce: 0, coins: isM ? 0 : 5 });
                    }
                } else { for(let j=0; j<4; j++) this.tiles.push({ x: x + j*32, y: py, type: 'platform' }); }
                
                if (Math.random() < (0.4 + n*0.02)) {
                    let type = this.theme.isWater ? (Math.random() > 0.5 ? 'jelly' : 'shark') : 'goomba';
                    this.enemies.push(this.makeEnemy(x + 40, py - 40, type));
                }
            }
        } else {
            this.boss = { x: this.levelWidth - 600, y: 100, w: 80, h: 100, hp: 25 + n*6, maxHp: 25 + n*6, vx: -3 - (n/6), vy: 0, timer: 0 };
            for(let i=0; i<4; i++) this.tiles.push({ x: this.levelWidth - 1100 + i*250, y: 240, type: 'mystery', hit: false, bounce: 0, coins: 0 });
        }

        this.player = { x: 100, y: 200, w: 28, h: 36, vx: 0, vy: 0, onGround: false, facing: 1, invuln: 0, power: null, powerTimer: 0, hasDoubleJumped: false, scale: 1 };
        this.updateHUD();
    },

    makeEnemy(x, y, type) {
        return { x, y, type, w: 32, h: 32, vx: type === 'shark' ? -5 : -2, vy: 0, baseItemY: y, dead: false, timer: Math.random() * 100 };
    },

    update() {
        if (this.state === 'CUTSCENE') {
            this.cutsceneTimer++;
            if (this.cutsceneTimer < 60) {}
            else if (this.cutsceneTimer < 120) { this.cutsceneBoss.x -= 8; }
            else if (this.cutsceneTimer < 180) { this.cutscenePrincess.x = this.cutsceneBoss.x + 20; this.cutscenePrincess.y = this.cutsceneBoss.y + 40; }
            else if (this.cutsceneTimer < 280) { this.cutsceneBoss.x += 8; this.cutsceneBoss.y -= 3; this.cutscenePrincess.x = this.cutsceneBoss.x + 20; this.cutscenePrincess.y = this.cutsceneBoss.y + 40; }
            else { this.state = 'PLAYING'; }
            return;
        }

        if (this.state === 'FINISHING') {
            this.flagY += 5; if (this.flagY > 360) this.flagY = 360;
            this.flagTimer++;
            if (this.flagTimer % 12 === 0) this.spawnFirework();
            if (this.flagTimer > 180) this.nextLevel();
            return;
        }

        if (this.state !== 'PLAYING') return;
        const p = this.player; if (!p) return;
        if (p.invuln > 0) p.invuln--;
        if (p.powerTimer > 0 && p.powerTimer !== Infinity) { p.powerTimer--; if (p.powerTimer <= 0) { p.power = null; p.scale = 1; p.w=28; p.h=36; } }
        if (this.upPowerAlpha > 0) this.upPowerAlpha -= 0.015;

        let speedMult = (this.theme.isWater ? 0.6 : 1) * (p.power === 'speed' ? 1.8 : 1);
        const maxSpeed = 6 * speedMult;
        let accel = 1.4 * speedMult; let moving = false;
        
        if (this.keys['ArrowLeft']) { p.vx -= accel; p.facing = -1; moving = true; }
        else if (this.keys['ArrowRight']) { p.vx += accel; p.facing = 1; moving = true; }
        
        if (!moving) { p.vx *= this.theme.fric; if (!p.onGround && !this.theme.isWater) p.vx *= 0.95; }
        else { p.vx *= (this.theme.fric + (1 - this.theme.fric) * 0.5); }
        
        if (Math.abs(p.vx) < 0.1) p.vx = 0; if (p.vx > maxSpeed) p.vx = maxSpeed; if (p.vx < -maxSpeed) p.vx = -maxSpeed;

        const jumpForce = (p.power === 'jump' ? this.theme.jump - 6 : this.theme.jump) * (p.power === 'moon' ? 1.6 : 1);
        if (this.isPressed('Space') || this.isPressed('ArrowUp')) {
            if (this.theme.isWater || p.onGround || (p.power === 'double' && !p.hasDoubleJumped) || p.power === 'jetpack') {
                p.vy = jumpForce; audio[this.theme.isWater?'swim':'jump']();
                if (!p.onGround && !this.theme.isWater) p.hasDoubleJumped = true;
                p.onGround = false; this.spawnParticles(p.x, p.y + p.h, '#fff', 8);
            }
        }

        if ((this.isPressed('KeyF') || this.mouseFireTriggered) && (p.power === 'fire' || p.power === 'multi' || p.power === 'rapid')) {
            const count = p.power === 'multi' ? 3 : 1;
            if (this.fireballs.length < 15) {
                audio.fire();
                for(let i=0; i<count; i++) {
                    this.fireballs.push({ x: p.x + (p.facing===1?p.w:0), y: p.y + 10 + (i*5), w: 12, h: 12, vx: p.facing * 10, vy: (i-1)*3, life: 100 });
                }
            }
        }
        
        if ((this.keys['KeyF'] || this.mouseFireTriggered) && p.power === 'laser') {
            if (this.boss && this.rectIntersect(p, {x:this.boss.x-400, y:p.y-20, w:800, h:40})) {
                this.boss.hp -= 0.15; this.spawnParticles(this.boss.x+40, this.boss.y+40, '#f0f', 2);
                if (this.boss.hp <= 0) this.killBoss();
            }
        }
        this.mouseFireTriggered = false;

        p.vy += this.theme.grav * (p.power === 'float' ? 0.15 : 1); if (p.vy > 20) p.vy = 20;
        p.x += p.vx; if (p.x < 0) p.x = 0; this.checkCollision(p, 'x');
        p.y += p.vy; p.onGround = false; this.checkCollision(p, 'y');

        this.tiles.forEach(t => { if (t.bounce > 0) t.bounce -= 1; });
        let targetCam = p.x - 300; this.camera += (targetCam - this.camera) * 0.1;
        this.camera = Math.max(0, Math.min(this.camera, this.levelWidth - 800));

        this.enemies.forEach(e => {
            if (e.dead || e.x < this.camera - 300 || e.x > this.camera + 1100) return;
            e.timer++;
            if (e.type === 'jelly') { e.y = e.baseItemY + Math.sin(e.timer * 0.05) * 60; }
            else { e.x += e.vx * (this.theme.isWater ? 0.6 : 1); this.checkCollision(e, 'x'); e.vy += this.theme.grav; e.y += e.vy; this.checkCollision(e, 'y'); }
            if (this.rectIntersect(p, e)) {
                if (p.power === 'star' || p.power === 'titan' || p.power === 'mega') { e.dead = true; this.score += 300; audio.hit(); this.spawnParticles(e.x, e.y, '#f00', 12); }
                else if (p.power !== 'ghost' && p.vy > 0 && p.y < e.y + 12) { e.dead = true; p.vy = -16; this.score += 200; audio.hit(); }
                else if (p.invuln <= 0 && p.power !== 'ghost') this.takeDamage();
            }
        });

        for (let i = this.fireballs.length - 1; i >= 0; i--) {
            let fb = this.fireballs[i]; fb.x += fb.vx; fb.vy += 0.3; fb.y += fb.vy; fb.life--;
            let hitG = false; this.tiles.forEach(t => { if (this.rectIntersect(fb, t)) { if (fb.vy > 0) { fb.y = t.y - 12; fb.vy = -6; } else hitG = true; } });
            if (fb.life <= 0 || hitG) { this.fireballs.splice(i, 1); continue; }
            this.enemies.forEach(e => { if (!e.dead && this.rectIntersect(fb, e)) { e.dead = true; fb.life = 0; audio.hit(); this.spawnParticles(e.x, e.y, '#ff0', 8); } });
            if (this.boss && this.rectIntersect(fb, this.boss)) { this.boss.hp--; fb.life = 0; audio.hit(); if (this.boss.hp <= 0) this.killBoss(); }
        }

        for(let i = this.items.length - 1; i >= 0; i--) {
            let it = this.items[i]; it.y += it.vy; it.vy += 0.5;
            if (it.isCoin) { if (it.vy > 0 && it.y > it.originY) { this.items.splice(i, 1); continue; } }
            else {
                this.tiles.forEach(t => { if (t.y > it.y && this.rectIntersect({x:it.x, y:it.y, w:24, h:24}, t)) { it.y = t.y - 24; it.vy = 0; } });
                if (this.rectIntersect(p, {x:it.x, y:it.y, w:24, h:24})) { this.applyPower(it.power); this.items.splice(i, 1); }
            }
        }

        if (this.boss) {
            const b = this.boss; b.timer++; b.x += b.vx;
            if (b.x < this.levelWidth - 1200 || b.x > this.levelWidth - 100) b.vx *= -1;
            if (b.timer % 100 === 0) { b.vy = -16; audio.boss(); }
            b.vy += 0.5; b.y += b.vy; if (b.y > 450 - 64 - 100) { b.y = 450 - 64 - 100; b.vy = 0; }
            if (this.rectIntersect(p, b)) {
                if (p.power === 'star' || p.power === 'titan' || p.power === 'mega') { b.hp -= 0.2; this.spawnParticles(b.x+40, b.y+40, '#fff', 3); if(b.hp <= 0) this.killBoss(); }
                else if (p.invuln <= 0 && p.power !== 'ghost') this.takeDamage();
            }
        }

        if (p.x > this.levelWidth - 350 && this.level % 5 !== 0 && !this.flagTriggered) {
            this.flagTriggered = true; this.state = 'FINISHING'; this.score += 3000; audio.win();
        }
        if (this.princess && this.rectIntersect(p, this.princess)) this.win();
        if (p.y > 500) this.takeDamage(true);
        this.updateHUD();
        this.particles.forEach((pt, i) => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; if (pt.life <= 0) this.particles.splice(i, 1); });
    },

    checkCollision(entity, axis) {
        let isP = (entity === this.player);
        this.tiles.forEach(t => {
            if (this.rectIntersect(entity, {x:t.x, y:t.y, w:32, h:32})) {
                if (axis === 'x') { if (entity.vx > 0) entity.x = t.x - entity.w; else entity.x = t.x + 32; if (entity.vx && !isP) entity.vx *= -1; }
                else {
                    if (entity.vy > 0) { entity.y = t.y - entity.h; entity.vy = 0; if (isP) entity.onGround = true; }
                    else if (entity.vy < 0) { 
                        entity.y = t.y + 32; entity.vy = 0;
                        if (isP && (t.type === 'mystery' || t.type === 'block') && !t.hit) {
                            audio.bump();
                            if (t.type === 'block') {
                                if (t.coins > 0) { this.spawnCoin(t.x, t.y); t.coins--; t.bounce = 10; } 
                                else { t.hit = true; t.bounce = 10; }
                            } else if (t.type === 'mystery') {
                                t.hit = true; t.bounce = 10; this.spawnItem(t.x, t.y);
                            }
                        }
                    }
                }
            }
        });
    },

    rectIntersect(a, b) { let aw = a.w || 32, ah = a.h || 32; let bw = b.w || 32, bh = b.h || 32; return a.x < b.x + bw && a.x + aw > b.x && a.y < b.y + bh && a.y + ah > b.y; },
    spawnCoin(x, y) { this.score += 250; audio.coin(); this.items.push({ x: x+8, y: y-20, vy: -10, isCoin: true, originY: y }); },
    spawnItem(x, y) {
        let pwr = (this.level === 1 && this.mysteryCount === 0) ? POWERS.find(p => p.id === 'fire') : POWERS[Math.floor(Math.random() * POWERS.length)];
        this.mysteryCount++; this.items.push({ x: x+4, y: y-30, w: 24, h: 24, vy: -8, power: pwr, isCoin: false });
    },
    spawnFirework() {
        let fx = this.levelWidth - 300 + (Math.random() * 400 - 200); let fy = 50 + (Math.random() * 200);
        let colors = ['#f00','#0f0','#00f','#ff0','#f0f','#0ff','#fff','#ffa500'];
        for(let i=0; i<30; i++) { this.particles.push({ x: fx, y: fy, color: colors[Math.floor(Math.random()*colors.length)], vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 70 }); }
    },

    applyPower(pwr) {
        audio.powerup(); this.upPowerAlpha = 2.0; this.currentPowerName = pwr.name;
        const msgEl = document.getElementById('powerMsg'); 
        msgEl.innerText = `${pwr.name} UP POWER!`; 
        msgEl.style.opacity = 1; msgEl.style.transform = "scale(1.4)";
        setTimeout(() => { msgEl.style.opacity = 0; msgEl.style.transform = "scale(1)"; }, 3000);
        const p = this.player; p.power = pwr.id; p.powerTimer = 60 * 20;
        if (pwr.id === 'life') this.lives++; else if (pwr.id === 'score') this.score += 10000;
        else if (pwr.id === 'mega') { p.scale = 2.5; p.w = 70; p.h = 90; } else if (pwr.id === 'mini') { p.scale = 0.5; p.w = 14; p.h = 18; }
        else if (pwr.id === 'titan') { p.scale = 3.5; p.w = 98; p.h = 126; p.powerTimer = 60 * 15; }
        else if (pwr.id === 'shield' || pwr.id === 'shield2') p.powerTimer = Infinity;
        else if (pwr.id === 'bomb') { this.enemies.forEach(e=>e.dead=true); if(this.boss) this.boss.hp -= 8; this.score += 5000; }
    },

    takeDamage(isPit = false) {
        const p = this.player; if (!isPit && (p.power === 'shield' || p.power === 'shield2')) { p.power = null; p.invuln = 60; audio.hit(); return; }
        this.lives--; audio.hit();
        if (this.lives <= 0) { this.state = 'GAMEOVER'; document.getElementById('gameOverScreen').classList.remove('hidden'); }
        else { p.y = 100; p.vy = 0; p.invuln = 150; p.scale = 1; p.w = 28; p.h = 36; p.power = null; }
    },

    killBoss() {
        this.boss = null; audio.win(); this.score += 20000;
        if (this.level === 20) { this.princess = { x: this.levelWidth - 200, y: 338, w: 32, h: 48 }; }
        else { setTimeout(() => this.nextLevel(), 2000); }
    },

    nextLevel() {
        if (this.level >= this.maxLevels) return;
        this.state = 'TRANSITION'; document.getElementById('lvlName').innerText = `LEVEL ${this.level + 1}`; document.getElementById('lvlTheme').innerText = THEMES[this.level].name.toUpperCase();
        document.getElementById('levelScreen').classList.remove('hidden'); audio.win();
        setTimeout(() => { document.getElementById('levelScreen').classList.add('hidden'); this.state = 'PLAYING'; this.loadLevel(this.level + 1); }, 2000);
    },

    win() { this.state = 'WIN'; document.getElementById('winScreen').classList.remove('hidden'); audio.win(); },
    updateHUD() { document.getElementById('hudScore').innerText = `SCORE: ${this.score}`; document.getElementById('hudLevel').innerText = `LVL: ${this.level}`; document.getElementById('hudLives').innerText = '❤️'.repeat(Math.max(0, this.lives)); const pobj = POWERS.find(pw => pw.id === this.player?.power); document.getElementById('hudPower').innerText = `POWER: ${pobj ? pobj.name : 'NONE'}`; },
    hideScreens() { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); },

    draw() {
        const ctx = this.ctx; ctx.clearRect(0, 0, this.width, this.height);
        if (!this.theme) return;
        const g = ctx.createLinearGradient(0, 0, 0, this.height); g.addColorStop(0, this.theme.bg1); g.addColorStop(1, this.theme.bg2);
        ctx.fillStyle = g; ctx.fillRect(0, 0, this.width, this.height);
        ctx.save(); ctx.translate(-this.camera, 0);

        if (this.state === 'CUTSCENE') {
            this.drawSprite(Sprites.princess, this.cutscenePrincess.x, this.cutscenePrincess.y, 2.5);
            this.drawSprite(Sprites.boss, this.cutsceneBoss.x, this.cutsceneBoss.y, 4.5);
            ctx.restore(); return;
        }

        if (this.level % 5 !== 0) {
            let fx = this.levelWidth - 320; ctx.fillStyle = '#ccc'; ctx.fillRect(fx, 150, 10, 250); 
            ctx.fillStyle = '#f00'; ctx.fillRect(fx+10, this.flagY, 50, 40); 
            let cx = this.levelWidth - 220, lvl = this.level;
            ctx.fillStyle = `hsl(${lvl * 85}, 70%, 55%)`; ctx.fillRect(cx, 450 - 64 - 120, 180, 120); 
            ctx.fillStyle = `hsl(${lvl * 85 + 180}, 65%, 45%)`; ctx.fillRect(cx-40, 450 - 64 - 200, 60, 200); ctx.fillRect(cx+160, 450 - 64 - 200, 60, 200); 
            ctx.fillStyle = '#fff'; ctx.fillRect(cx+75, 450-64-60, 40, 60); 
        }

        if (this.princess) this.drawSprite(Sprites.princess, this.princess.x, this.princess.y, 2.5);
        this.tiles.forEach(t => {
            if (t.x < this.camera - 32 || t.x > this.camera + 800) return;
            let by = t.y - (t.bounce ? Math.sin(t.bounce) * 5 : 0);
            if (t.type === 'ground') { ctx.fillStyle = (t.y > 450-40) ? this.theme.gMid : this.theme.gTop; ctx.fillRect(t.x, by, 32, 32); ctx.strokeRect(t.x, by, 32, 32); }
            else { 
                ctx.fillStyle = t.hit ? '#852' : (t.type==='mystery'?'#f80':'#ca3'); 
                ctx.fillRect(t.x, by, 32, 32); ctx.strokeRect(t.x, by, 32, 32); 
                if(!t.hit && t.type==='mystery') { ctx.fillStyle='#fff'; ctx.font='bold 22px Arial'; ctx.fillText('?', t.x+10, by+24); } 
            }
        });
        
        if (this.player?.power === 'laser' && (this.keys['KeyF'] || this.mouseFireTriggered)) {
            ctx.fillStyle = '#f0f'; ctx.fillRect(this.player.x + 20, this.player.y + 10, 800, 15);
            ctx.shadowBlur = 25; ctx.shadowColor = "#f0f"; ctx.fillRect(this.player.x + 20, this.player.y + 10, 800, 15); ctx.shadowBlur = 0;
        }

        this.fireballs.forEach(fb => { ctx.fillStyle = '#ff4'; ctx.beginPath(); ctx.arc(fb.x+6, fb.y+6, 9, 0, Math.PI*2); ctx.fill(); });
        this.enemies.forEach(e => { if (!e.dead) this.drawSprite(Sprites[e.type] || Sprites.goomba, e.x, e.y, e.type==='shark'?3.5:3.0, e.vx > 0); });
        this.items.forEach(it => {
            if (it.isCoin) { ctx.fillStyle = "#ff0"; ctx.beginPath(); ctx.ellipse(it.x+8, it.y+10, 8, 12, 0, 0, Math.PI*2); ctx.fill(); } 
            else { ctx.fillStyle = it.power.color; ctx.fillRect(it.x, it.y, 24, 24); ctx.strokeRect(it.x, it.y, 24, 24); }
        });

        if (this.boss) { 
            this.drawSprite(Sprites.boss, this.boss.x, this.boss.y, 5.0); 
            ctx.fillStyle = '#300'; ctx.fillRect(this.boss.x - 20, this.boss.y - 40, 120, 15);
            ctx.fillStyle = '#f00'; ctx.fillRect(this.boss.x - 20, this.boss.y - 40, 120 * (this.boss.hp / this.boss.maxHp), 15);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(this.boss.x - 20, this.boss.y - 40, 120, 15);
        }

        const p = this.player;
        if (p && (p.invuln % 8 < 4)) {
            this.drawSprite((!p.onGround || this.theme.isWater) ? Sprites.player.jump : Sprites.player.stand, p.x, p.y-4, 2.3 * p.scale, p.facing===-1);
            if (this.upPowerAlpha > 0) { 
                ctx.fillStyle = `rgba(255,255,255,${this.upPowerAlpha})`; 
                ctx.font = "bold 26px Arial"; ctx.shadowColor = "#ff0"; ctx.shadowBlur = 15;
                ctx.fillText(this.currentPowerName + " UP POWER!", p.x - 60, p.y - 50); ctx.shadowBlur = 0;
            }
        }
        if (this.theme.isWater) { ctx.fillStyle = 'rgba(0, 100, 255, 0.15)'; ctx.fillRect(this.camera, 0, 800, 450); }
        this.particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life / 60; ctx.fillRect(pt.x, pt.y, 7, 7); }); ctx.globalAlpha = 1;
        ctx.restore();
    },

    drawSprite(data, x, y, scale, flip = false) {
        data.forEach((row, iy) => {
            [...row].forEach((char, ix) => {
                const color = Sprites.colors[char];
                if (color) { this.ctx.fillStyle = color; let dx = flip ? (row.length - ix) * scale : ix * scale; this.ctx.fillRect(x + dx, y + iy * scale, scale, scale); }
            });
        });
    },

    loop() { 
        this.update(); 
        this.draw(); 
        requestAnimationFrame(() => this.loop()); 
    }
};

window.onload = () => game.init();
</script>
